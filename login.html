<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - AnimeKu</title>

  <!-- CSS -->
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/fontawesome.css">
  <link rel="stylesheet" href="assets/css/templatemo-cyborg-gaming.css">
  <link rel="stylesheet" href="assets/css/owl.css">
  <link rel="stylesheet" href="assets/css/animate.css">

  <style>
    .login-box {
      max-width: 500px;
      margin: 80px auto;
      background: #1f2122;
      padding: 40px;
      border-radius: 23px;
      text-align: center;
    }

    .login-box h2 {
      color: white;
      margin-bottom: 30px;
    }

    .login-box input {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 25px;
      border: none;
      outline: none;
      background: #27292a;
      color: white;
    }

    .login-box button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 25px;
      background: #ec6090;
      color: white;
      font-weight: bold;
      transition: 0.3s;
    }

    .login-box button:hover {
      background: #d94f7d;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="header-area header-sticky">
  <div class="container">
    <nav class="main-nav">

      <!-- LOGO -->
      <a href="index.html" class="logo">
        <img src="assets/images/logo.png" alt="AnimeKu" style="width:150px; height:auto;">
      </a>

      <!-- SEARCH -->
      <div class="search-input">
        <input type="text" placeholder="Cari anime...">
      </div>

      <!-- MENU -->
      <ul class="nav">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="streams.html">Anime Sedang Tayang</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="profile.html">Profil</a></li>
      </ul>

    </nav>
  </div>
</header>

<!-- LOGIN FORM -->
<div class="container">
  <div class="page-content">

    <div class="login-box">
      <h2><em>Login</em> AnimeKu</h2>

      <input type="text" id="username" placeholder="Masukkan Nama">
      <input type="password" id="password" placeholder="Masukkan Password">

      <button onclick="loginUser()">Login Sekarang</button>

      <p style="color: #666; margin-top:20px;">
        Masuk untuk menyimpan anime favoritmu!
      </p>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="container">
    <p>© 2026 AnimeKu | Halaman Login</p>
  </div>
</footer>

<!-- JS -->
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.min.js"></script>
<script src="assets/js/custom.js"></script>

<!-- LOGIN SCRIPT -->
<script>
function loginUser() {
  let username = document.getElementById("username").value;
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  if(username === "" || email === "" || password === "") {
    alert("Isi semua data dulu ya!");
    return;
  }

  // Simpan data ke browser
  localStorage.setItem("username", username);
  localStorage.setItem("email", email);

  alert("Login berhasil, selamat datang " + username + "!");

  // Pindah ke profile
  window.location.href = "profile.html";
}
</script>

</body>
</html>
