<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login AnimeKu</title>

  <!-- CSS TEMPLATE -->
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/fontawesome.css">
  <link rel="stylesheet" href="assets/css/templatemo-cyborg-gaming.css">

  <!-- STYLE TAMBAHAN -->
  <style>
    .login-container {
      max-width: 450px;
      margin: 100px auto;
      background: #1f2122;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
    }

    .login-container h2 {
      color: white;
      margin-bottom: 25px;
    }

    .login-container input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: none;
      border-radius: 25px;
      background: #27292a;
      color: white;
      outline: none;
    }

    .login-container button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 25px;
      background: #ec6090;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      background: #ff4e4e;
      color: white;
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      border-radius: 10px;
      display: none;
    }

    #alertBox {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: #00c851;
      color: white;
      padding: 12px 25px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="header-area header-sticky">
  <div class="container">
    <nav class="main-nav">

       <a href="index.html" class="logo-text">
          AnimeKu
       </a>


      <ul class="nav">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="streams.html">Anime Sedang Tayang</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="profile.html">Profil</a></li>
      </ul>

    </nav>
  </div>
</header>

<!-- ALERT -->
<div id="alertBox">Login berhasil!</div>

<!-- LOGIN -->
<div class="container">
  <div class="login-container">

    <h2>Login AnimeKu</h2>

    <!-- USERNAME -->
    <input type="text" id="username" placeholder="Masukkan Username">

    <!-- PASSWORD -->
    <input type="password" id="password" placeholder="Masukkan Password">

    <!-- BUTTON -->
    <button onclick="loginUser()">Login</button>

    <!-- MESSAGE -->
    <p id="message"></p>

  </div>
</div>

<!-- JS -->
<script src="js/register.js" defer></script>

</body>
</html>
